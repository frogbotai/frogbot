display_information:
  name: FrogBot
features:
  bot_user:
    display_name: FrogBot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: '{{FROGBOT_URL}}/api/webhooks/{{SLACK_INSTANCE_SLUG}}'
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: '{{FROGBOT_URL}}/api/webhooks/{{SLACK_INSTANCE_SLUG}}'
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
