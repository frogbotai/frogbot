name: strip-attribution

# Removes AI attribution from issue, PR, review and comment text written by the owner's account
# (where cloud agents post): "Generated by/with Claude Code" footers, Co-Authored-By and
# Claude-Session lines, and "Requested by ... project thread" lines. The GitHub tools in Claude
# sessions add the footer to every post, so a prompt alone can't stop it. Edits made with the
# Actions token start no new workflow runs. Run it by hand (workflow_dispatch) to clean
# everything already posted. KEEP_SESSION_LINKS below decides whether bare session links stay.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.body, 'claude') ||
      contains(github.event.comment.body, 'claude') ||
      contains(github.event.pull_request.body, 'claude') ||
      contains(github.event.review.body, 'claude') ||
      contains(github.event.issue.body, 'co-authored-by') ||
      contains(github.event.comment.body, 'co-authored-by') ||
      contains(github.event.pull_request.body, 'co-authored-by') ||
      contains(github.event.review.body, 'co-authored-by')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          cat > strip.py <<'PY'
          import json, os, re, subprocess, sys

          # True keeps bare claude.ai session links (the one-tap way back into a session). False removes them too.
          KEEP_SESSION_LINKS = True

          DROP = [re.compile(p, re.I) for p in (
              r'^\s*(🤖\s*)?_?Generated (by|with) \[?Claude\b',
              r'^\s*🤖\s*Generated (by|with)\b',
              r'^\s*Co-Authored-By:',
              r'^\s*Claude-Session:',
              r'^\s*_?Requested by \*\*.*\]\(https://claude\.ai/code/project/',
              r'^\s*_?(Written|Contributed|Authored|Co-authored) (by|with) Claude\b',
          )]
          SESSION = re.compile(r'https://claude\.ai/code/session_[A-Za-z0-9]+')
          LINK_ONLY = re.compile(r'^\s*(Session:\s*)?<?https://claude\.ai/code/session_[A-Za-z0-9]+>?\s*$', re.I)


          def clean(body):
              if not body:
                  return body
              lines = body.replace('\r\n', '\n').split('\n')
              links, kept, fence = [], [], False
              for line in lines:
                  if line.lstrip().startswith('```'):
                      fence = not fence
                  if not fence and any(p.search(line) for p in DROP):
                      links += SESSION.findall(line)
                      continue
                  if not fence and not KEEP_SESSION_LINKS and LINK_ONLY.match(line):
                      continue
                  kept.append(line)
              while kept and kept[-1].strip() in ('', '---'):
                  kept.pop()
              text = '\n'.join(kept)
              if KEEP_SESSION_LINKS and links and links[0] not in text:
                  text += '\n\n' + links[0]
              original = body.replace('\r\n', '\n').rstrip()
              return body if text == original else text + '\n'


          def gh(*args, data=None):
              out = subprocess.run(['gh', 'api', *args], input=data, capture_output=True, text=True)
              if out.returncode:
                  print(out.stderr, file=sys.stderr)
                  raise SystemExit(1)
              return out.stdout


          def items(path):
              for line in gh('--paginate', path, '--jq', '.[] | tojson').splitlines():
                  if line.strip():
                      yield json.loads(line)


          def fix(path, body, method='PATCH'):
              new = clean(body)
              if new == body:
                  return
              gh('-X', method, path, '--input', '-', data=json.dumps({'body': new}))
              print('cleaned', path)


          TRUSTED = {'OWNER', 'MEMBER', 'COLLABORATOR'}
          # The Actions token can't see private org membership, so members can show up as CONTRIBUTOR.
          # Trust named logins, then fall back to the author's permission on the repo.
          LOGINS = set(os.environ.get('TRUSTED_LOGINS', 'cgilly2fast').split())
          _perm = {}


          def trusted(item):
              login = (item.get('user') or {}).get('login', '')
              if item.get('author_association') in TRUSTED or login in LOGINS:
                  return True
              if login not in _perm:
                  out = subprocess.run(['gh', 'api', f'repos/{repo}/collaborators/{login}/permission', '--jq', '.permission'],
                                       capture_output=True, text=True)
                  _perm[login] = out.returncode == 0 and out.stdout.strip() in ('admin', 'maintain', 'write')
              return _perm[login]

          repo = os.environ['REPO']
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          name = os.environ['EVENT']

          if name == 'issues':
              it = event['issue']
              if trusted(it):
                  fix(f"repos/{repo}/issues/{it['number']}", it['body'])
          elif name == 'issue_comment':
              c = event['comment']
              if trusted(c):
                  fix(f"repos/{repo}/issues/comments/{c['id']}", c['body'])
          elif name == 'pull_request_target':
              pr = event['pull_request']
              if trusted(pr):
                  fix(f"repos/{repo}/pulls/{pr['number']}", pr['body'])
          elif name == 'pull_request_review':
              r = event['review']
              if trusted(r):
                  fix(f"repos/{repo}/pulls/{event['pull_request']['number']}/reviews/{r['id']}", r['body'], 'PUT')
          elif name == 'pull_request_review_comment':
              c = event['comment']
              if trusted(c):
                  fix(f"repos/{repo}/pulls/comments/{c['id']}", c['body'])
          elif name == 'workflow_dispatch':
              for it in items(f"repos/{repo}/issues?state=all&per_page=100"):
                  if trusted(it):
                      fix(f"repos/{repo}/issues/{it['number']}", it['body'])
                  if 'pull_request' in it:
                      for r in items(f"repos/{repo}/pulls/{it['number']}/reviews?per_page=100"):
                          if trusted(r):
                              fix(f"repos/{repo}/pulls/{it['number']}/reviews/{r['id']}", r['body'], 'PUT')
              for c in items(f"repos/{repo}/issues/comments?per_page=100"):
                  if trusted(c):
                      fix(f"repos/{repo}/issues/comments/{c['id']}", c['body'])
              for c in items(f"repos/{repo}/pulls/comments?per_page=100"):
                  if trusted(c):
                      fix(f"repos/{repo}/pulls/comments/{c['id']}", c['body'])
          PY
          python3 strip.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
