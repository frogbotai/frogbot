name: pr-message

# PRs are squash-merged with the PR title as the whole commit message. This checks the title
# with frogbot's scripts/commit-msg.mjs, the subject rule `pnpm ticket land` applied.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frogbotai/frogbot
          sparse-checkout: scripts/commit-msg.mjs
          sparse-checkout-cone-mode: false
      - run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
          node scripts/commit-msg.mjs "$RUNNER_TEMP/message"
        env:
          TITLE: ${{ github.event.pull_request.title }}
