name: pr-message

# PRs are squash-merged with the PR title as the whole commit message. This checks the title
# with frogbot's scripts/commit-msg.mjs, the subject rule `pnpm ticket land` applied, and
# refuses commits that carry attribution lines (Co-authored-by, Claude-Session, "Generated
# with", claude.ai links) or are authored as Claude: GitHub turns other commit authors and
# Co-authored-by lines into co-author credit on the squash commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frogbotai/frogbot
          sparse-checkout: scripts/commit-msg.mjs
          sparse-checkout-cone-mode: false
      - run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/message"
          node scripts/commit-msg.mjs "$RUNNER_TEMP/message"
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - run: |
          commits=$(gh api "repos/$REPO/pulls/$PR/commits?per_page=100")
          lines=$(jq -r '.[] | .sha[0:7] as $s | .commit.message | split("\n")[] | select(test("^\\s*(co-authored-by:|claude-session:|(🤖\\s*)?_?generated (with|by)\\b|(written|contributed|authored) (by|with) claude)|claude\\.ai/code"; "i")) | $s + " " + .' <<<"$commits")
          authors=$(jq -r '.[] | select([.commit.author.email, .commit.committer.email] | any(test("anthropic\\.com$"; "i"))) | .sha[0:7] + " " + .commit.author.name + " <" + .commit.author.email + ">"' <<<"$commits")
          if [ -n "$lines" ] || [ -n "$authors" ]; then
            [ -n "$lines" ] && printf 'pr-message: attribution lines in commits (GitHub would carry Co-authored-by into the squash):\n%s\n' "$lines"
            [ -n "$authors" ] && printf 'pr-message: commits authored or committed as Claude (the squash would credit Claude as a co-author):\n%s\n' "$authors"
            echo "Rewrite them as the owner with no attribution lines, e.g. git rebase -x 'git commit --amend --no-edit --reset-author' origin/main"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
