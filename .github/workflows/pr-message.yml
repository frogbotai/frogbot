name: pr-message

# PRs are squash-merged, and GitHub builds the commit from the PR's title and description.
# This checks them with frogbot's scripts/commit-msg.mjs, the same rules `pnpm ticket land`
# applied: a Conventional Commit subject, and no Co-authored-by or "Generated with" lines.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: frogbotai/frogbot
          sparse-checkout: scripts/commit-msg.mjs
          sparse-checkout-cone-mode: false
      - run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/message"
          node scripts/commit-msg.mjs "$RUNNER_TEMP/message"
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
