name: strip-footer

# Claude cloud sessions end PR descriptions and issue comments with a footer like
# `_Generated by [Claude Code](https://claude.ai/code/session_…)_`. This removes it and keeps
# the session link as a bare line, unless the text already has that link. PR descriptions are
# always cleaned. Comments are cleaned only when they start with the ticket agent's
# <!-- frogbot-agent --> marker, so replies to an @claude mention keep theirs. Run it by hand
# (workflow_dispatch) to clean every existing comment and PR description.
on:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       contains(github.event.pull_request.body, 'Generated by [Claude Code]')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '<!-- frogbot-agent -->') &&
       contains(github.event.comment.body, 'Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          cat > clean.py <<'PY'
          import re, sys
          body = open('body.md').read()
          footer = re.compile(r'\s*(?:---\s*\n)?_Generated by \[Claude Code\]\((https://claude\.ai/code[^)\s]*)\)_\s*$')
          match = footer.search(body)
          if not match:
              sys.exit(1)
          rest = body[:match.start()].rstrip()
          link = match.group(1)
          if '/session_' in link and link not in rest:
              rest += '\n\n' + link
          open('body.md', 'w').write(rest + '\n')
          PY

          clean() { # $1: API path of a comment or PR; $2: the field that holds its text
            gh api "$1" --jq ".$2 // \"\"" > body.md
            if python3 clean.py; then
              gh api -X PATCH "$1" -F "$2=@body.md" --silent
              echo "cleaned $1"
            fi
          }

          case "$EVENT" in
            issue_comment) clean "repos/$REPO/issues/comments/$COMMENT_ID" body ;;
            pull_request_target) clean "repos/$REPO/pulls/$PR_NUMBER" body ;;
            workflow_dispatch)
              for id in $(gh api --paginate "repos/$REPO/issues/comments?per_page=100" \
                --jq '.[] | select((.body | contains("<!-- frogbot-agent -->")) and (.body | contains("Generated by [Claude Code]"))) | .id'); do
                clean "repos/$REPO/issues/comments/$id" body
              done
              for n in $(gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" \
                --jq '.[] | select((.body // "") | contains("Generated by [Claude Code]")) | .number'); do
                clean "repos/$REPO/pulls/$n" body
              done
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
