name: strip-footer

# Comments posted from Claude cloud sessions always end with a "Generated by Claude Code"
# footer. Ticket-agent comments start with the <!-- frogbot-agent --> marker, and this
# removes the footer from those only. Replies to an @claude mention have no marker, so
# they keep it. Run it by hand (workflow_dispatch) to clean every existing comment.
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.comment.body, '<!-- frogbot-agent -->') &&
       contains(github.event.comment.body, 'Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            ids=$(gh api --paginate "repos/$REPO/issues/comments?per_page=100" \
              --jq '.[] | select((.body | contains("<!-- frogbot-agent -->")) and (.body | contains("Generated by [Claude Code]"))) | .id')
          else
            ids=$COMMENT_ID
          fi
          for id in $ids; do
            gh api "repos/$REPO/issues/comments/$id" --jq .body > body.md
            python3 - <<'PY'
          import re
          body = open('body.md').read()
          clean = re.sub(r'\s*---\s*\n_Generated by \[Claude Code\]\(https://claude\.ai/code\)_\s*$', '', body).rstrip() + '\n'
          open('body.md', 'w').write(clean)
          PY
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md --silent
            echo "stripped $id"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
